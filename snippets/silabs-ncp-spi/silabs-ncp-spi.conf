CONFIG_GPIO=y
CONFIG_MFD=y
# CPC core runs on CMSIS RTOS v2
CONFIG_NUM_PREEMPT_PRIORITIES=56
CONFIG_CMSIS_V2_THREAD_DYNAMIC_MAX_COUNT=2
CONFIG_CMSIS_V2_THREAD_DYNAMIC_STACK_SIZE=2048
CONFIG_CMSIS_V2_THREAD_MAX_STACK_SIZE=2048
CONFIG_CMSIS_V2_MUTEX_MAX_COUNT=16
CONFIG_CMSIS_V2_SEMAPHORE_MAX_COUNT=16
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=16384
CONFIG_SPI=y
CONFIG_SPI_STM32_INTERRUPT=y
