title: Silicon Labs SiWx91x NWP connected over SPI

description: |
  The Network Wireless Processor (NWP) manages Wi-Fi and Bluetooth connectivity on SiWx91x devices,
  offloading wireless networking tasks from the main processor and
  supporting configurable power and performance modes.

  This binding covers the SiWN917 parts, where the NWP is a standalone chip
  driven by an arbitrary host over SPI.

  Example:

    &eusart1 {
            cs-gpios = <&gpioc 3 GPIO_ACTIVE_LOW>;

            nwp: siwx91x-nwp@0 {
                    compatible = "silabs,siwx91x-nwp-spi";
                    reg = <0>;
                    spi-max-frequency = <10000000>;
                    irq-gpios = <&gpioa 8 GPIO_ACTIVE_HIGH>;
                    antenna-selection = "internal";
                    clock-frequency = <80000000>;

                    wifi {
                            compatible = "silabs,siwx91x-wifi";
                    };
            };
    };

compatible: "silabs,siwx91x-nwp-spi"

include: ["silabs,siwx91x-nwp-common.yaml", spi-device.yaml]

properties:
  irq-gpios:
    type: phandle-array
    required: true
    description: |
      INT_OUT signal. The NWP asserts it when it has data or events pending for
      the host.

  reset-gpios:
    type: phandle-array
    description: |
      Optional RESET_N signal used to reset the NWP. If it is not provided,
      the driver does not reset the NWP.
