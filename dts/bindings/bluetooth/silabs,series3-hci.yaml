description: |
  Bluetooth HCI controller running on a Silicon Labs Series 3 network
  co-processor. The node is a child of the "silabs,ncp" device, the HCI
  packets (H4 framing) are carried by a dedicated CPC endpoint.

  Example:

    &ncp {
        ncp_hci: bt-hci {
            compatible = "silabs,series3-hci";
        };
    };

compatible: "silabs,series3-hci"

include: bt-hci.yaml

properties:
  bt-hci-name:
    default: "series3"
  bt-hci-bus:
    default: "virtual"
  endpoint-id:
    type: int
    default: 14
    description: |
      CPC endpoint carrying the HCI packets. Defaults to the Bluetooth RCP
      endpoint of CPC.
